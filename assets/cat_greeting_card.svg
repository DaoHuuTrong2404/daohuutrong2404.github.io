<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0914" />
      <stop offset="50%" stop-color="#140E2A" />
      <stop offset="100%" stop-color="#0A1820" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="35%" stop-color="#9D4EDD" />
      <stop offset="70%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00FF87" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#00FF87" />
    </linearGradient>

    <linearGradient id="catEarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feColorMatrix type="matrix" values="0.4 0 0 0 0.47   0 0.9 0 0 0.96   0 0 0.8 0 0.83   0 0 0 0.35 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseEyes {
      0%, 100% { opacity: 0.9; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(1.15); }
      75% { opacity: 0.3; transform: scaleY(0.2); }
    }
    @keyframes waveTail {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(12deg); }
    }
    @keyframes floatPaws {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .cat-eye { transform-origin: center; animation: pulseEyes 4s ease-in-out infinite; }
    .cat-paw { animation: floatPaws 2.5s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'JetBrains Mono', monospace; font-weight: 800; font-size: 23px; letter-spacing: -0.01em; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; font-weight: 600; font-size: 13.5px; fill: #E2E8F0; }
    .badge-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; }
  </style>

  <!-- Outer Card with Glowing Border -->
  <rect x="6" y="6" width="838" height="188" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#cardGlow)" />

  <!-- Cyber Grid Background Pattern Details -->
  <g opacity="0.12" stroke="#00F5D4" stroke-width="0.8">
    <line x1="20" y1="50" x2="830" y2="50" stroke-dasharray="4,6" />
    <line x1="20" y1="100" x2="830" y2="100" stroke-dasharray="4,6" />
    <line x1="20" y1="150" x2="830" y2="150" stroke-dasharray="4,6" />
    <line x1="180" y1="20" x2="180" y2="180" stroke-dasharray="4,6" />
    <line x1="450" y1="20" x2="450" y2="180" stroke-dasharray="4,6" />
    <line x1="720" y1="20" x2="720" y2="180" stroke-dasharray="4,6" />
  </g>

  <!-- High-Tech Corner Brackets -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#00F5D4" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 834 32 L 834 16 L 818 16" fill="none" stroke="#7928CA" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 16 168 L 16 184 L 32 184" fill="none" stroke="#7928CA" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 834 168 L 834 184 L 818 184" fill="none" stroke="#00FF87" stroke-width="2.5" stroke-linecap="round" />

  <!-- ==================== LEFT: CUTE CYBER NEKO MASCOT ==================== -->
  <g transform="translate(42, 35)">
    <!-- Radar Hologram Halo -->
    <circle cx="55" cy="65" r="52" fill="none" stroke="#7928CA" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />
    <circle cx="55" cy="65" r="45" fill="none" stroke="#00F5D4" stroke-width="1" opacity="0.4" />
    <circle cx="55" cy="65" r="40" fill="#120D24" />

    <!-- Cat Ears -->
    <polygon points="28,42 40,14 56,38" fill="url(#catEarGrad)" stroke="#00F5D4" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="34,38 42,22 52,36" fill="#00F5D4" opacity="0.35" />

    <polygon points="82,42 70,14 54,38" fill="url(#catEarGrad)" stroke="#00F5D4" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="76,38 68,22 58,36" fill="#00F5D4" opacity="0.35" />

    <!-- Cat Head -->
    <ellipse cx="55" cy="64" rx="34" ry="29" fill="#1C1438" stroke="#9D4EDD" stroke-width="2" />

    <!-- Futuristic Cyber Visor Glass / Eyes -->
    <g class="cat-eye">
      <!-- Left Eye -->
      <ellipse cx="43" cy="60" rx="6.5" ry="9" fill="#00F5D4" filter="url(#neonGlow)" />
      <ellipse cx="44" cy="58" rx="2.5" ry="3.5" fill="#FFFFFF" />
      <!-- Right Eye -->
      <ellipse cx="67" cy="60" rx="6.5" ry="9" fill="#00F5D4" filter="url(#neonGlow)" />
      <ellipse cx="68" cy="58" rx="2.5" ry="3.5" fill="#FFFFFF" />
    </g>

    <!-- Cat Cute Nose & Mouth -->
    <polygon points="55,69 52,66 58,66" fill="#FF70A6" />
    <path d="M 52 71 Q 55 74 58 71" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />

    <!-- Cyber Whiskers (Glowing Cyan & Purple) -->
    <line x1="22" y1="62" x2="3" y2="58" stroke="#00F5D4" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <line x1="22" y1="67" x2="5" y2="70" stroke="#00F5D4" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <line x1="88" y1="62" x2="107" y2="58" stroke="#9D4EDD" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <line x1="88" y1="67" x2="105" y2="70" stroke="#9D4EDD" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

    <!-- Futuristic Cyber Collar & Bell -->
    <rect x="36" y="88" width="38" height="6" rx="3" fill="#7928CA" stroke="#00F5D4" stroke-width="1" />
    <circle cx="55" cy="98" r="5" fill="#00FF87" filter="url(#neonGlow)" />

    <!-- Cute Paw Print -->
    <g class="cat-paw" transform="translate(86, 88)">
      <circle cx="10" cy="10" r="5" fill="#00F5D4" opacity="0.9" />
      <circle cx="4" cy="3" r="2.2" fill="#00F5D4" opacity="0.9" />
      <circle cx="10" cy="1" r="2.2" fill="#00F5D4" opacity="0.9" />
      <circle cx="16" cy="3" r="2.2" fill="#00F5D4" opacity="0.9" />
    </g>
  </g>

  <!-- ==================== CENTER & RIGHT CONTENT ==================== -->
  <g transform="translate(195, 30)">
    <!-- Small Top Status Chip -->
    <rect x="0" y="0" width="220" height="22" rx="11" fill="rgba(121, 40, 202, 0.28)" stroke="#7928CA" stroke-width="1" />
    <circle cx="12" cy="11" r="4.5" fill="#00FF87" filter="url(#neonGlow)" />
    <text x="24" y="15" fill="#00FF87" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">ONLINE • CTU AI K52 COHORT</text>

    <!-- Main Title with Gradient -->
    <text x="0" y="52" fill="url(#titleGrad)" class="title-text" filter="url(#neonGlow)">
      🐾 MEOW! WELCOME TO DTRONGVIP'S AI CYBER-SPACE
    </text>

    <!-- Subtitle: Student Info -->
    <text x="0" y="80" class="sub-text">
      Sinh viên Kỹ thuật <tspan fill="#00F5D4" font-weight="800">Trí Tuệ Nhân Tạo (AI)</tspan> • Trường ĐH Cần Thơ (<tspan fill="#9D4EDD" font-weight="800">CTU - CICT</tspan>) • AI Agent Architect
    </text>

    <!-- Tag Chips Row -->
    <g transform="translate(0, 102)">
      <!-- Chip 1: Autonomous Agents -->
      <g>
        <rect x="0" y="0" width="160" height="28" rx="8" fill="rgba(0, 245, 212, 0.12)" stroke="#00F5D4" stroke-width="1.2" />
        <text x="12" y="18" fill="#00F5D4" class="badge-text">🤖 Autonomous Swarms</text>
      </g>

      <!-- Chip 2: Competitive C++ -->
      <g transform="translate(170, 0)">
        <rect x="0" y="0" width="145" height="28" rx="8" fill="rgba(157, 78, 221, 0.15)" stroke="#9D4EDD" stroke-width="1.2" />
        <text x="12" y="18" fill="#D8B4FE" class="badge-text">⚡ C++20 Algorithms</text>
      </g>

      <!-- Chip 3: Creative 3D WebGL -->
      <g transform="translate(325, 0)">
        <rect x="0" y="0" width="145" height="28" rx="8" fill="rgba(0, 255, 135, 0.12)" stroke="#00FF87" stroke-width="1.2" />
        <text x="12" y="18" fill="#00FF87" class="badge-text">✨ 3D WebGL Motion</text>
      </g>

      <!-- Chip 4: Codespaces Cloud -->
      <g transform="translate(480, 0)">
        <rect x="0" y="0" width="145" height="28" rx="8" fill="rgba(121, 40, 202, 0.18)" stroke="#7928CA" stroke-width="1.2" />
        <text x="12" y="18" fill="#C084FC" class="badge-text">☁️ Codespaces 16GB</text>
      </g>
    </g>
  </g>
</svg>
