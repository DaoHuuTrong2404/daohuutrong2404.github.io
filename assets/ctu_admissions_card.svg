<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090714" />
      <stop offset="50%" stop-color="#120D26" />
      <stop offset="100%" stop-color="#08141C" />
    </linearGradient>

    <linearGradient id="borderStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="35%" stop-color="#7928CA" />
      <stop offset="70%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#00FF87" />
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>

    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#00FF87" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.08em; fill: #00F5D4; }
    .name-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; font-weight: 800; font-size: 21px; fill: #FFFFFF; }
    .label { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px; fill: #9D4EDD; }
    .value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; font-size: 13.5px; fill: #E2E8F0; }
    .quote-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; font-style: italic; font-size: 12.5px; fill: #CBD5E1; }
    .badge-mono { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 10px; }
  </style>

  <!-- Card Background with Glowing Border -->
  <rect x="6" y="6" width="838" height="308" rx="20" fill="url(#cardBg)" stroke="url(#borderStroke)" stroke-width="2.5" />

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.08" stroke="#00F5D4" stroke-width="0.8">
    <line x1="20" y1="80" x2="830" y2="80" stroke-dasharray="3,6" />
    <line x1="20" y1="160" x2="830" y2="160" stroke-dasharray="3,6" />
    <line x1="20" y1="240" x2="830" y2="240" stroke-dasharray="3,6" />
    <line x1="570" y1="20" x2="570" y2="300" stroke-dasharray="3,6" />
  </g>

  <!-- Top Institutional Bar -->
  <g transform="translate(30, 26)">
    <!-- CTU CICT Tag -->
    <rect x="0" y="0" width="440" height="24" rx="12" fill="rgba(0, 245, 212, 0.12)" stroke="#00F5D4" stroke-width="1.2" />
    <text x="14" y="16" class="header-title">🏛️ TRƯỜNG ĐH CẦN THƠ (CTU) • TRƯỜNG CNTT &amp; TRUYỀN THÔNG (CICT)</text>
  </g>

  <!-- ==================== LEFT COLUMN: ACADEMIC DOSSIER ==================== -->
  <g transform="translate(30, 72)">
    <!-- Student Name & Tech Alias -->
    <text x="0" y="24" class="name-title">
      ĐÀO HỮU TRỌNG <tspan fill="#00F5D4" font-weight="700">(DTrongVIP)</tspan>
    </text>

    <!-- Student Details Matrix -->
    <g transform="translate(0, 44)">
      <!-- Row 1: Student ID & Cohort -->
      <text x="0" y="0" class="label">MÃ SINH VIÊN:</text>
      <text x="135" y="0" class="value" font-weight="700" fill="#00FF87">B2605840</text>

      <text x="260" y="0" class="label">NIÊN KHÓA:</text>
      <text x="350" y="0" class="value">K52 (2026 – 2031)</text>

      <!-- Row 2: Major -->
      <text x="0" y="26" class="label">CHUYÊN NGÀNH:</text>
      <text x="135" y="26" class="value" font-weight="700">Kỹ thuật Trí Tuệ Nhân Tạo (Artificial Intelligence)</text>

      <!-- Row 3: Core Research -->
      <text x="0" y="52" class="label">HƯỚNG NGHIÊN CỨU:</text>
      <text x="135" y="52" class="value">Autonomous Swarm Agents, CUA 2.0, Siêu thuật toán C++20</text>

      <!-- Row 4: Engineering Discipline -->
      <text x="0" y="78" class="label">KỶ LUẬT KỸ THUẬT:</text>
      <text x="135" y="78" class="value" fill="#00F5D4">Zero Self-Certification • Test-First • Cloud Compute 16GB</text>
    </g>

    <!-- Statement / Quote Box -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="520" height="54" rx="10" fill="rgba(121, 40, 202, 0.18)" stroke="#7928CA" stroke-width="1" />
      <text x="14" y="24" class="quote-text">
        "Cam kết cống hiến trọn vẹn đam mê, chinh phục các giải thưởng Olympic Tin học,
      </text>
      <text x="14" y="42" class="quote-text">
        ICPC và đóng góp nghiên cứu khoa học chất lượng cao suốt 5 năm tại ĐH Cần Thơ."
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: OFFICIAL VERIFIED BADGE ==================== -->
  <g transform="translate(585, 45)">
    <!-- Badge Container Card -->
    <rect x="0" y="0" width="235" height="245" rx="16" fill="rgba(18, 13, 38, 0.85)" stroke="url(#borderStroke)" stroke-width="1.8" />

    <!-- Top Chip -->
    <rect x="42" y="14" width="150" height="20" rx="10" fill="rgba(0, 255, 135, 0.15)" stroke="#00FF87" stroke-width="1" />
    <text x="56" y="28" fill="#00FF87" class="badge-mono">● VERIFIED ENROLLED</text>

    <!-- Holographic Emblem / Cat Seal -->
    <g transform="translate(117, 90)">
      <!-- Outer Orbiting Rings -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="#7928CA" stroke-width="1.5" stroke-dasharray="5,4" />
      <circle cx="0" cy="0" r="36" fill="none" stroke="#00F5D4" stroke-width="1.2" />
      <circle cx="0" cy="0" r="30" fill="#0C081D" />

      <!-- Cute Golden/Emerald Neko Silhouette -->
      <polygon points="-16,-6 -6,-24 0,-10" fill="#9D4EDD" stroke="#00F5D4" stroke-width="1.2" />
      <polygon points="16,-6 6,-24 0,-10" fill="#9D4EDD" stroke="#00F5D4" stroke-width="1.2" />
      <ellipse cx="0" cy="4" rx="20" ry="17" fill="#1A1238" stroke="#00F5D4" stroke-width="1.5" />
      <!-- Eyes -->
      <circle cx="-7" cy="2" r="3" fill="#00F5D4" filter="url(#glow)" />
      <circle cx="7" cy="2" r="3" fill="#00F5D4" filter="url(#glow)" />
      <circle cx="-6" cy="1" r="1" fill="#FFFFFF" />
      <circle cx="8" cy="1" r="1" fill="#FFFFFF" />
      <!-- Nose & Mouth -->
      <polygon points="0,7 -2,5 2,5" fill="#FF70A6" />
      <path d="M -3 9 Q 0 11 3 9" fill="none" stroke="#E2E8F0" stroke-width="1" />
    </g>

    <!-- Badge Info Details -->
    <text x="117" y="160" text-anchor="middle" fill="#00F5D4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">
      CAN THO UNIVERSITY
    </text>
    <text x="117" y="178" text-anchor="middle" fill="#D8B4FE" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">
      AI COHORT 52 • CICT
    </text>

    <!-- Bottom Status Bar -->
    <g transform="translate(18, 198)">
      <rect x="0" y="0" width="200" height="30" rx="8" fill="rgba(0, 245, 212, 0.12)" stroke="#00F5D4" stroke-width="1" />
      <text x="100" y="19" text-anchor="middle" fill="#00F5D4" class="badge-mono">
        🎓 ADMISSIONS READY
      </text>
    </g>
  </g>
</svg>
