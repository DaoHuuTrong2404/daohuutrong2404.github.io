<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <!-- ==================== GRADIENTS (NGỌC LAM / TURQUOISE PALETTE) ==================== -->
    <!-- Lush Deep Turquoise Night Background -->
    <linearGradient id="bgTurquoise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021417" />
      <stop offset="30%" stop-color="#04262C" />
      <stop offset="70%" stop-color="#063E47" />
      <stop offset="100%" stop-color="#02191D" />
    </linearGradient>

    <!-- Flowing Wave 1 (Vibrant Electric Turquoise) -->
    <linearGradient id="waveTurq1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#00CED1" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#06D6A0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Flowing Wave 2 (Deep Sea Aqua) -->
    <linearGradient id="waveTurq2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B525B" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#14747F" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#028090" stop-opacity="0.8" />
    </linearGradient>

    <!-- Flowing Wave 3 (Neon Cyan-Mint Highlight) -->
    <linearGradient id="waveTurq3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70EE9C" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#00F5D4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.5" />
    </linearGradient>

    <!-- Master Border Glowing Gradient -->
    <linearGradient id="bannerBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="25%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="75%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#06D6A0" />
    </linearGradient>

    <!-- Multi-Stop Iridescent Holographic Text Fill -->
    <linearGradient id="holoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#C7F9EE" />
      <stop offset="45%" stop-color="#00F5D4" />
      <stop offset="70%" stop-color="#B9FBC0" />
      <stop offset="85%" stop-color="#E2B4FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Golden Sparkle Gradient -->
    <linearGradient id="goldSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="50%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="turqNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textShadow3D" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00F5D4" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Pattern: Cyber Grid Dots -->
    <pattern id="cyberGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#00F5D4" opacity="0.18" />
    </pattern>
  </defs>

  <style>
    @keyframes floatStar {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.85; }
      50% { transform: translateY(-5px) rotate(15deg); opacity: 1; }
    }
    @keyframes waveShift {
      0% { transform: translateX(0); }
      100% { transform: translateX(-40px); }
    }
    @keyframes pulseAura {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .star-glow { animation: floatStar 3.5s ease-in-out infinite; transform-origin: center; }
    .brand-main {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', 'Plus Jakarta Sans', sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: -0.02em;
    }
    .brand-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'JetBrains Mono', sans-serif;
      font-weight: 700;
      font-size: 14.5px;
      letter-spacing: 0.04em;
    }
    .chip-font {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.05em;
    }
  </style>

  <!-- ==================== BACKGROUND & FRAME ==================== -->
  <rect x="5" y="5" width="910" height="250" rx="24" fill="url(#bgTurquoise)" stroke="url(#bannerBorderGrad)" stroke-width="2.8" />

  <!-- Cyber Grid Pattern Overlay -->
  <rect x="6" y="6" width="908" height="248" rx="23" fill="url(#cyberGrid)" />

  <!-- ==================== ARTISTIC ORGANIC TURQUOISE WAVES ==================== -->
  <!-- Wave 2 (Deep Sea Aqua Layer) -->
  <path d="M 6 170 Q 230 110 460 175 T 914 150 L 914 254 L 6 254 Z" fill="url(#waveTurq2)" />

  <!-- Wave 1 (Vibrant Electric Turquoise Layer) -->
  <path d="M 6 200 Q 210 135 480 205 T 914 180 L 914 254 L 6 254 Z" fill="url(#waveTurq1)" />

  <!-- Wave 3 (Neon Highlight Ribbon Crest) -->
  <path d="M 6 205 Q 210 140 480 210 T 914 185" fill="none" stroke="url(#waveTurq3)" stroke-width="3" opacity="0.85" filter="url(#turqNeonGlow)" />

  <!-- ==================== HIGH-TECH HUD CORNERS & LIGHT FLARES ==================== -->
  <!-- Corner Tech HUD Brackets -->
  <g stroke="#00F5D4" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 20 40 L 20 20 L 40 20" />
    <path d="M 900 40 L 900 20 L 880 20" stroke="#00FF87" />
    <path d="M 20 220 L 20 240 L 40 240" stroke="#7928CA" />
    <path d="M 900 220 L 900 240 L 880 240" stroke="#00F5D4" />
  </g>

  <!-- Luminous Bokeh Particles & Stars -->
  <g fill="#00F5D4">
    <circle cx="80" cy="50" r="2.5" opacity="0.7" />
    <circle cx="140" cy="110" r="1.5" opacity="0.6" />
    <circle cx="280" cy="40" r="2" opacity="0.5" />
    <circle cx="780" cy="45" r="2" opacity="0.7" />
    <circle cx="850" cy="95" r="3" opacity="0.8" filter="url(#turqNeonGlow)" />
    <circle cx="730" cy="130" r="1.5" opacity="0.5" />
    <circle cx="210" cy="160" r="2.5" opacity="0.6" />
  </g>

  <!-- Glowing 4-Point Sparkles (Artistic Sparkle Stars) -->
  <g class="star-glow" transform="translate(68, 65)">
    <path d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z" fill="url(#goldSparkle)" filter="url(#turqNeonGlow)" />
  </g>

  <g class="star-glow" transform="translate(845, 60)">
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#00F5D4" filter="url(#turqNeonGlow)" />
  </g>

  <g class="star-glow" transform="translate(485, 30)">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- ==================== CENTER CONTENT & ARTISTIC TYPOGRAPHY ==================== -->
  <g transform="translate(460, 0)">
    <!-- Top Pill Badge: Can Tho University AI Cohort 52 -->
    <g transform="translate(0, 32)">
      <rect x="-195" y="0" width="390" height="26" rx="13" fill="rgba(2, 38, 44, 0.85)" stroke="#00F5D4" stroke-width="1.4" filter="url(#turqNeonGlow)" />
      <circle cx="-178" cy="13" r="4.5" fill="#00FF87" filter="url(#turqNeonGlow)" />
      <text x="0" y="17" text-anchor="middle" fill="#00F5D4" class="chip-font">
        🐾 CTU AI COHORT 52 • CAN THO UNIVERSITY • DTRONGVIP 🐾
      </text>
    </g>

    <!-- Master Artistic Brand Title ("chữ màu mè vẽ vời đỉnh cao") -->
    <!-- Layer 1: Ambient Neon Glow Aura behind text -->
    <text x="0" y="106" text-anchor="middle" fill="#00F5D4" class="brand-main" filter="url(#turqNeonGlow)" opacity="0.75">
      DTrongVIP  ✨  Đào Hữu Trọng
    </text>

    <!-- Layer 2: Main Radiant 3D Holographic Typography -->
    <text x="0" y="106" text-anchor="middle" fill="url(#holoTextGrad)" stroke="#022B32" stroke-width="1.8" class="brand-main" filter="url(#textShadow3D)">
      <tspan fill="#00F5D4">DTrong</tspan><tspan fill="#FFFFFF">VIP</tspan>
      <tspan fill="url(#goldSparkle)" font-size="38"> ✨ </tspan>
      <tspan fill="#FFFFFF">Đào </tspan><tspan fill="#00F5D4">Hữu </tspan><tspan fill="#06D6A0">Trọng</tspan>
    </text>

    <!-- Subtitle: Student Profile & Specialization with High-Contrast Turquoise Styling -->
    <text x="0" y="142" text-anchor="middle" class="brand-sub">
      <tspan fill="#E0FFFF">🐾 AI Engineering @ </tspan>
      <tspan fill="#00F5D4" font-weight="900">Can Tho University (CTU)</tspan>
      <tspan fill="#A7F3D0"> | </tspan>
      <tspan fill="#C4B5FD" font-weight="800">Autonomous Swarm Agents</tspan>
      <tspan fill="#A7F3D0"> | </tspan>
      <tspan fill="#6EE7B7" font-weight="800">Creative 3D WebGL</tspan>
    </text>

    <!-- Interactive Glowing Tech Feature Chips Row -->
    <g transform="translate(0, 168)">
      <!-- Chip 1: Autonomous Swarms -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="0" width="168" height="30" rx="9" fill="rgba(2, 28, 33, 0.9)" stroke="#00F5D4" stroke-width="1.3" />
        <text x="84" y="19" text-anchor="middle" fill="#00F5D4" class="chip-font">🤖 AUTONOMOUS AGENTS</text>
      </g>

      <!-- Chip 2: High-Performance C++20 -->
      <g transform="translate(-180, 0)">
        <rect x="0" y="0" width="165" height="30" rx="9" fill="rgba(18, 14, 38, 0.9)" stroke="#9D4EDD" stroke-width="1.3" />
        <text x="82" y="19" text-anchor="middle" fill="#E2B4FF" class="chip-font">⚡ C++20 ALGORITHMS</text>
      </g>

      <!-- Chip 3: Creative 3D WebGL Motion -->
      <g transform="translate(-3, 0)">
        <rect x="0" y="0" width="165" height="30" rx="9" fill="rgba(3, 35, 30, 0.9)" stroke="#06D6A0" stroke-width="1.3" />
        <text x="82" y="19" text-anchor="middle" fill="#06D6A0" class="chip-font">✨ 3D WEBGL MOTION</text>
      </g>

      <!-- Chip 4: 16GB Codespaces Hub -->
      <g transform="translate(174, 0)">
        <rect x="0" y="0" width="186" height="30" rx="9" fill="rgba(10, 20, 35, 0.9)" stroke="#38BDF8" stroke-width="1.3" />
        <text x="93" y="19" text-anchor="middle" fill="#7DD3FC" class="chip-font">☁️ CODESPACES 16GB HUB</text>
      </g>
    </g>

    <!-- Bottom Status Indicator Dot & Subline -->
    <g transform="translate(0, 222)">
      <circle cx="-135" cy="0" r="3.5" fill="#00FF87" filter="url(#turqNeonGlow)" />
      <text x="0" y="4" text-anchor="middle" fill="#CCFBF1" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">
        ● SYSTEM READY • ZERO SELF-CERTIFICATION • TEST-FIRST ENGINEERING
      </text>
      <circle cx="135" cy="0" r="3.5" fill="#00FF87" filter="url(#turqNeonGlow)" />
    </g>
  </g>
</svg>
