<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090614" />
      <stop offset="50%" stop-color="#140E2C" />
      <stop offset="100%" stop-color="#08141C" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="35%" stop-color="#7928CA" />
      <stop offset="70%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#00FF87" />
    </linearGradient>

    <!-- Text Quote Gradient -->
    <linearGradient id="quoteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="60%" stop-color="#E2B4FF" />
      <stop offset="100%" stop-color="#00FF87" />
    </linearGradient>

    <!-- Cat Ear Gradient -->
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlowFooter" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes purrPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    @keyframes earWiggle {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-4deg); }
      60% { transform: rotate(4deg); }
    }
    .purr-cat { transform-origin: 100px 90px; animation: purrPulse 3s ease-in-out infinite; }
    .quote-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; font-weight: 800; font-size: 19.5px; letter-spacing: -0.01em; }
    .quote-author { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; font-size: 13px; font-weight: 600; fill: #A855F7; }
    .btn-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; }
    .status-mono { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 800; }
  </style>

  <!-- Card Frame -->
  <rect x="6" y="6" width="838" height="238" rx="22" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="2.5" />

  <!-- Subtle Cyber Matrix Grid Background -->
  <g opacity="0.08" stroke="#00F5D4" stroke-width="0.8">
    <line x1="20" y1="60" x2="830" y2="60" stroke-dasharray="4,6" />
    <line x1="20" y1="120" x2="830" y2="120" stroke-dasharray="4,6" />
    <line x1="20" y1="180" x2="830" y2="180" stroke-dasharray="4,6" />
    <line x1="580" y1="20" x2="580" y2="230" stroke-dasharray="4,6" />
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 18 36 L 18 18 L 36 18" fill="none" stroke="#00F5D4" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 832 36 L 832 18 L 814 18" fill="none" stroke="#7928CA" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 18 214 L 18 232 L 36 232" fill="none" stroke="#7928CA" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 832 214 L 832 232 L 814 232" fill="none" stroke="#00FF87" stroke-width="2.5" stroke-linecap="round" />

  <!-- ==================== LEFT: MANIFESTO & SOCIAL CONTACTS ==================== -->
  <g transform="translate(35, 25)">
    <!-- Status Chip -->
    <rect x="0" y="0" width="280" height="24" rx="12" fill="rgba(0, 245, 212, 0.12)" stroke="#00F5D4" stroke-width="1.2" />
    <circle cx="14" cy="12" r="4.5" fill="#00FF87" filter="url(#neonGlowFooter)" />
    <text x="28" y="16" fill="#00F5D4" class="status-mono">DTrongVIP • ARTIFICIAL INTELLIGENCE CORE</text>

    <!-- Inspiring Quote with Gradient & Glow -->
    <text x="0" y="56" fill="url(#quoteGrad)" class="quote-main" filter="url(#neonGlowFooter)">
      "Mọi dòng code là một bước chân
    </text>
    <text x="0" y="82" fill="url(#quoteGrad)" class="quote-main" filter="url(#neonGlowFooter)">
      hướng về tương lai thông minh và tự chủ."
    </text>

    <!-- Author & Institutional Attribution -->
    <text x="0" y="112" class="quote-author">
      — <tspan fill="#FFFFFF" font-weight="700">Đào Hữu Trọng</tspan> • Sinh viên AI @ Trường ĐH Cần Thơ (CTU - CICT - K52)
    </text>

    <!-- Social Connect High-Tech Buttons Row 1 -->
    <g transform="translate(0, 132)">
      <!-- Button 1: Email -->
      <a href="mailto:huutrong748@gmail.com">
        <rect x="0" y="0" width="235" height="32" rx="8" fill="rgba(234, 67, 53, 0.15)" stroke="#EA4335" stroke-width="1.2" />
        <text x="14" y="20" fill="#FFA5A5" class="btn-mono">📧 huutrong748@gmail.com</text>
      </a>

      <!-- Button 2: GitHub -->
      <a href="https://github.com/DaoHuuTrong2404" transform="translate(245, 0)">
        <rect x="0" y="0" width="265" height="32" rx="8" fill="rgba(121, 40, 202, 0.22)" stroke="#9D4EDD" stroke-width="1.2" />
        <text x="14" y="20" fill="#E2B4FF" class="btn-mono">⚡ GitHub: DaoHuuTrong2404</text>
      </a>
    </g>

    <!-- Social Connect High-Tech Buttons Row 2 -->
    <g transform="translate(0, 172)">
      <!-- Button 3: 3D Portal -->
      <a href="https://daohuutrong2404.github.io">
        <rect x="0" y="0" width="235" height="32" rx="8" fill="rgba(0, 245, 212, 0.15)" stroke="#00F5D4" stroke-width="1.2" />
        <text x="14" y="20" fill="#00F5D4" class="btn-mono">🎮 3D WebGL Portfolio ↗</text>
      </a>

      <!-- Button 4: CTU Portal -->
      <a href="https://ctu.edu.vn" transform="translate(245, 0)">
        <rect x="0" y="0" width="265" height="32" rx="8" fill="rgba(0, 85, 165, 0.25)" stroke="#0080FF" stroke-width="1.2" />
        <text x="14" y="20" fill="#88C4FF" class="btn-mono">🏛️ Can Tho University (CTU) ↗</text>
      </a>
    </g>
  </g>

  <!-- ==================== RIGHT: CUTE RESTING CYBER NEKO MASCOT ==================== -->
  <g transform="translate(605, 20)">
    <!-- Right Container Box -->
    <rect x="0" y="0" width="215" height="210" rx="18" fill="rgba(18, 13, 38, 0.85)" stroke="url(#footerBorder)" stroke-width="1.8" />

    <!-- Top Chip -->
    <rect x="32" y="14" width="150" height="22" rx="11" fill="rgba(0, 245, 212, 0.12)" stroke="#00F5D4" stroke-width="1" />
    <text x="107" y="29" text-anchor="middle" fill="#00F5D4" class="status-mono">🐾 CYBER NEKO BOT</text>

    <!-- Cute Winking / Happy Cyber Cat Illustration -->
    <g class="purr-cat" transform="translate(107, 95)">
      <!-- Radar Circle Halo -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="#7928CA" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />
      <circle cx="0" cy="0" r="35" fill="none" stroke="#00F5D4" stroke-width="1" opacity="0.4" />
      <circle cx="0" cy="0" r="28" fill="#130D28" />

      <!-- Cat Ears -->
      <polygon points="-16,-6 -6,-25 2,-10" fill="url(#earGrad)" stroke="#00F5D4" stroke-width="1.2" />
      <polygon points="16,-6 6,-25 -2,-10" fill="url(#earGrad)" stroke="#00F5D4" stroke-width="1.2" />

      <!-- Cat Head -->
      <ellipse cx="0" cy="4" rx="23" ry="19" fill="#1E1442" stroke="#9D4EDD" stroke-width="1.8" />

      <!-- Cute Happy Eyes (^ ‿ ^) -->
      <path d="M -13 2 Q -8 -4 -3 2" fill="none" stroke="#00F5D4" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlowFooter)" />
      <path d="M 3 2 Q 8 -4 13 2" fill="none" stroke="#00F5D4" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlowFooter)" />

      <!-- Nose & Smile -->
      <polygon points="0,6 -2,4 2,4" fill="#FF70A6" />
      <path d="M -4 9 Q 0 13 4 9" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />

      <!-- Cyber Whiskers -->
      <line x1="-15" y1="4" x2="-28" y2="1" stroke="#00F5D4" stroke-width="1.2" stroke-linecap="round" />
      <line x1="-15" y1="8" x2="-27" y2="10" stroke="#00F5D4" stroke-width="1.2" stroke-linecap="round" />
      <line x1="15" y1="4" x2="28" y2="1" stroke="#9D4EDD" stroke-width="1.2" stroke-linecap="round" />
      <line x1="15" y1="8" x2="27" y2="10" stroke="#9D4EDD" stroke-width="1.2" stroke-linecap="round" />

      <!-- Little Heart Icon -->
      <path d="M 0 -36 C -5 -43, -12 -38, -12 -32 C -12 -26, 0 -18, 0 -18 C 0 -18, 12 -26, 12 -32 C 12 -38, 5 -43, 0 -36 Z" fill="#FF007F" filter="url(#softGlow)" transform="scale(0.45)" />
    </g>

    <!-- Bottom Message -->
    <text x="107" y="162" text-anchor="middle" fill="#00FF87" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">
      THANKS FOR VISITING!
    </text>
    <text x="107" y="180" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">
      Stay Curious • Keep Hacking ✨
    </text>
  </g>
</svg>
